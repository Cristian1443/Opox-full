name: Keep Render backend awake

# El plan free de Render duerme el servicio tras 15 min sin tráfico y tarda
# 30-60s en despertar. Este workflow hace ping cada 10 min para evitarlo.
# Solo pingea el backend OPOX — el Motor IA se migró a ia.opox.jaeverba.com
# (uvicorn propio, sin cold start).
# Coste: ~1s × 4320 runs/mes ≈ 72 min/mes del cupo gratuito de 2000 min.

on:
  schedule:
    # Cada 10 minutos. GitHub Actions puede tardar hasta 5-15 min extra
    # en disparar cron (limitación conocida), lo cual es suficiente para
    # el umbral de 15 min de Render.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping OPOX backend
        run: |
          curl -fsS -m 60 https://opox-backend-x2mu.onrender.com/health \
            || echo "backend unreachable (posible cold start en curso)"
